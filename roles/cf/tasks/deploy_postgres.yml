---
- name: Create Coldfront Postgres to level directories
  ansible.builtin.file:
    path: "{{ cf_db_dir }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { dir:  "" }
