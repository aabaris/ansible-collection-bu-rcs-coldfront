---
# Steps 7-9. Quadlet files are generated by the podman modules, which create
# the quadlet directory and derive the filename from `name`.
# Application services start later, after bootstrap.

- name: Create the instance network quadlet
  containers.podman.podman_network:
    name: "{{ cf_network }}"
    state: quadlet
  register: _cf_network_unit

- name: Create container quadlets
  containers.podman.podman_container:
    name: "{{ cf_prefix }}{{ item.name }}"
    image: "{{ item.image }}"
    network: ["{{ cf_network }}.network"]
    env: "{{ item.environment | default({}) }}"
    volume: "{{ item.volumes }}"
    publish: "{{ item.publish }}"
    command: "{{ item.exec | default(omit, true) }}"
    secrets: "{{ (item.secrets_raw | default([]))
                 + (_cf_app_secret_args if item.app_secrets | default(false) else []) }}"
    state: quadlet
    quadlet_options: "{{ item.quadlet_options }}"
  loop: "{{ cf_services }}"
  loop_control:
    label: "{{ cf_prefix }}{{ item.name }}"
  when: item.enabled | default(true) | bool
  register: _cf_container_units

# podman_container state=absent removes the container, not the quadlet file,
# and podman_quadlet wraps `podman quadlet rm`, which needs a newer podman than
# RHEL 9 ships. Remove the file directly.
- name: Remove quadlets for unmanaged services
  ansible.builtin.file:
    path: "{{ _cf_quadlet_dir }}/{{ cf_prefix }}{{ item.name }}.container"
    state: absent
  loop: "{{ cf_services }}"
  loop_control:
    label: "{{ cf_prefix }}{{ item.name }}"
  when: not (item.enabled | default(true) | bool)
  register: _cf_units_removed

- name: Reload systemd for quadlet regeneration
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: (_cf_network_unit is changed)
        or (_cf_container_units is changed)
        or (_cf_units_removed is changed)

- name: Start data services
  ansible.builtin.systemd_service:
    name: "{{ cf_prefix }}{{ item }}.service"
    state: started
    enabled: true
  loop: "{{ (['db'] if cf_db_managed | bool else [])
            + (['redis'] if cf_redis_managed | bool else []) }}"

# Throwaway diagnostics use `podman run` directly: podman_container is built
# for persistent containers, does not return rc, and fail_json's on non-zero
# exit -- which makes a retry loop on exit status impossible to express.
- name: Wait for postgres to accept connections
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - "{{ cf_network }}"
      - "{{ cf_db_image }}"
      - pg_isready
      - -h
      - "{{ _cf_db_host_effective }}"
      - -p
      - "{{ cf_db_port }}"
      - -U
      - "{{ cf_db_user }}"
  register: _cf_pg_ready
  until: _cf_pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
