---
# Ensure one podman secret exists. Include once per secret.
#
#
# CONTRACT -- in
#   cf_secret_key     (required) short name, e.g. "db_password"
#   cf_secret_length  (optional) bytes of entropy when generating, default 32
#   cf_secret_rotate  (optional) true => replace even if it already exists
#
# VARIABLE ASSOCIATION
#   The podman secret is named  {{ cf_instance }}_{{ cf_secret_key }}
#   and its seed is read from   cf_{{ cf_secret_key }}
#
#   So cf_secret_key: db_password  ->  secret coldfront1-cf-db_password
#                                      seeded from inventory var cf_db_password
#
#   Leave cf_db_password at its default "" and a value is generated on the
#   target. Set it in inventory (vault it) and that value is installed instead.
#   Either way it is installed once and never rewritten.
#
# CONTRACT -- out
#   cf_secret_changed  bool, true if this call created or replaced the secret
#
# NOTE Mounted secrets are copied into a container at creation time, so a
#   rotation needs the container recreated, not reloaded.

- name: "secret: resolve {{ cf_secret_key }}"
  ansible.builtin.set_fact:
    _secret_name: "{{ cf_instance }}_{{ cf_secret_key }}"
    _secret_seed: "{{ lookup('vars', 'cf_' ~ cf_secret_key, default='') | string }}"
  no_log: true

- name: "secret: check whether {{ cf_secret_key }} exists"
  ansible.builtin.command:
    argv: [podman, secret, inspect, "{{ _secret_name }}"]
  register: _secret_state
  changed_when: false
  failed_when: false

- name: "secret: remove {{ cf_secret_key }} for rotation"
  ansible.builtin.command:
    argv: [podman, secret, rm, "{{ _secret_name }}"]
  when:
    - cf_secret_rotate | default(false) | bool
    - _secret_state.rc == 0

- name: "secret: decide whether {{ cf_secret_key }} needs creating"
  ansible.builtin.set_fact:
    _secret_needed: "{{ _secret_state.rc != 0 or (cf_secret_rotate | default(false) | bool) }}"

# Seeded from inventory. The module sends the value over stdin, never argv.
- name: "secret: install {{ cf_secret_key }} from cf_{{ cf_secret_key }}"
  containers.podman.podman_secret:
    name: "{{ _secret_name }}"
    data: "{{ _secret_seed }}"
    state: present
    skip_existing: true
  no_log: true
  when:
    - _secret_needed | bool
    - _secret_seed | length > 0

# No seed given. Entropy is produced on the target and piped straight into
# podman: the value never reaches the control node, never hits disk, never
# appears in argv.
- name: "secret: generate {{ cf_secret_key }} on target"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl rand -hex {{ cf_secret_length | default(32) }}
      | tr -d '\n'
      | podman secret create {{ _secret_name | quote }} -
    executable: /bin/bash
  when:
    - _secret_needed | bool
    - _secret_seed | length == 0

- name: "secret: publish result for {{ cf_secret_key }}"
  ansible.builtin.set_fact:
    cf_secret_changed: "{{ _secret_needed | bool }}"
