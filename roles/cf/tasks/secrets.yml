---
# Generate-once podman secrets. skip_existing leaves an existing secret exactly
# as it is, so an unconfigured instance comes up immediately and re-running the
# same repo never rotates a working password.
#
# Seeds come from the matching cf_<key> variable: cf_secrets key `db_password`
# is seeded from `cf_db_password`, `secret_key` from `cf_secret_key`. When the
# seed is empty a random value is generated -- regenerated on every run, but
# only ever used the first time.

- name: Ensure secrets exist
  containers.podman.podman_secret:
    name: "{{ cf_prefix }}{{ item.key }}"
    data: >-
      {{ lookup('vars', 'cf_' ~ item.key, default='')
         or lookup('password', '/dev/null', length=48,
                   chars=['ascii_letters', 'digits']) }}
    state: present
    skip_existing: true
  loop: "{{ _cf_secrets_active }}"
  loop_control:
    label: "{{ cf_prefix }}{{ item.key }}"
  no_log: true
  when: cf_secrets_generate | bool

- name: Verify secrets exist when generation is disabled
  containers.podman.podman_secret_info:
    name: "{{ cf_prefix }}{{ item.key }}"
  loop: "{{ _cf_secrets_active }}"
  loop_control:
    label: "{{ cf_prefix }}{{ item.key }}"
  when: not (cf_secrets_generate | bool)

# Formatted `secrets:` arguments for podman_container, built as an explicit
# loop rather than a filter chain so it stays readable.
- name: Build container secret arguments
  ansible.builtin.set_fact:
    _cf_app_secret_args: >-
      {{ (_cf_app_secret_args | default([]))
         + [ cf_prefix ~ item.key
             ~ (',type=env' if item.value.type == 'env' else '')
             ~ ',target=' ~ item.value.target ] }}
  loop: "{{ _cf_secrets_mount + _cf_secrets_env }}"
  loop_control:
    label: "{{ item.key }}"
